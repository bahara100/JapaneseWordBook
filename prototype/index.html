<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#245c48">
  <title>하루일본어 · 학습 화면 설계</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./polish.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="주요 메뉴">
      <a class="brand" href="#/home"><span class="brand-symbol" lang="ja">日</span><span>하루일본어<small>A LITTLE, EVERY DAY</small></span></a>
      <nav id="desktop-nav"></nav>
      <div class="sidebar-foot"><span class="sidebar-leaf" aria-hidden="true">✳</span><span class="tiny-label">AT YOUR OWN PACE</span><p>작은 배움이 쌓여,<br>나의 일본어가 되는 하루.</p><button class="text-button" data-route="settings">학습 설정</button></div>

    </div>

  <nav id="mobile-nav" class="mobile-nav" aria-label="모바일 주요 메뉴"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./app.js"></script>

</html>
